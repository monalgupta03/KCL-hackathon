<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SavourIt - Make the most of your food</title>
  <meta name="theme-color" content="#2e6b3a">
  <meta name="description" content="Keep track of your groceries, use food before it goes to waste, and find meals from your pantry.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <div id="phone">
      <div id="notch"></div>
      <header>SavourIt <span class="brand-tagline">Good food. Less waste.</span></header>
      <main id="view" aria-label="SavourIt content"></main>
      <nav aria-label="Main navigation">
        <button data-action="tab" data-tab="fridge" class="active">Pantry</button>
        <button data-action="tab" data-tab="cook">Cook</button>
        <button data-action="tab" data-tab="add">Add</button>
      </nav>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/fridge.js"></script>
  <script src="js/cook.js"></script>
  <script src="js/add.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
